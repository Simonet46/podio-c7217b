# Config remota de Supabase (se aplica con `supabase config push`).
# Solo declaramos lo que queremos pisar; el resto queda como está en el dashboard.
project_id = "ruugpxfgpbtajrxbabvg"

[auth]
# A dónde redirigen los magic links si no traen redirect_to explícito.
site_url = "https://somosgranito.com"
# Lista blanca de redirects permitidos (sin esto, los links caen en localhost).
# Mantenemos también el dominio viejo de github.io por si queda algún link en tránsito.
additional_redirect_urls = [
  "https://somosgranito.com/**",
  "https://www.somosgranito.com/**",
  "https://simonet46.github.io/podio-c7217b/**",
]

# Valores que ya están así en remoto — los fijamos para que el push no los
# pise con los defaults del CLI.
[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8
# Los magic links duran 24 h (el default de 1 h dejaba links muertos si el
# atleta no abría el email enseguida).
otp_expiry = 86400

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# SMTP propio vía Resend: habilita los templates custom y manda los emails
# desde el dominio de GRANITO. La clave vive en .env.local (RESEND_API_KEY)
# y se inyecta al hacer push — nunca se commitea.
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@somosgranito.com"
sender_name = "GRANITO"

[auth.email.template.invite]
subject = "Bienvenido/a a GRANITO 🥇 Tu cuenta de atleta está lista"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Tu link de acceso a GRANITO"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Creá tu contraseña nueva de GRANITO"
content_path = "./supabase/templates/recovery.html"

# ── Funciones PÚBLICAS: las llama gente sin JWT (Mercado Pago, el sitio
# estático, el navegador del atleta). verify_jwt=false acá es OBLIGATORIO y
# tiene que vivir en este archivo: si se deploya sin --no-verify-jwt, el CLI
# toma el valor de acá. El 04/08/2026 un redeploy de mp-webhook sin el flag
# lo dejó en true y el gateway rebotó con 401 TODAS las notificaciones de
# pago de MP durante 9 días — se perdieron donaciones reales ($2.000) hasta
# la reconciliación a mano del 13/08. No repetir.

[functions.mp-webhook]
# Lo llama Mercado Pago sin ningún header. Con JWT activado no entra un solo pago.
verify_jwt = false

[functions.mp-oauth-callback]
# Redirect del OAuth de MP: llega del navegador, sin sesión.
verify_jwt = false

[functions.mp-claim-pending]
# Lo llama el form público de postulación.
verify_jwt = false

[functions.record-acceptance]
# Evidencia legal de aceptación: la registra el sitio público.
verify_jwt = false

[functions.athlete-recover]
# Recupero de acceso del atleta: por definición, todavía no tiene sesión.
verify_jwt = false

[functions.mp-app-connect-url]
# Link de conexión de MP durante la postulación (sin cuenta todavía).
verify_jwt = false
